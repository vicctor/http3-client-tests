spring.application.name=http3

server.port=${SERVER_PORT:8444}
server.http2.enabled=true

# HTTP/3 and QUIC Configuration
server.jetty.quic.enabled=true
server.jetty.quic.port=${SERVER_PORT:8444}
server.jetty.accesslog.enabled=true
server.jetty.max-http-header-size=65536

# HTTP/3 Early Hints Configuration
server.jetty.early-hints.enabled=true
server.jetty.http3.max-concurrent-streams=1000
server.jetty.http3.initial-session-recv-window=65536

server.ssl.bundle=service
spring.ssl.bundle.jks.service.key.alias=service
spring.ssl.bundle.jks.service.keystore.location=classpath:service-keystore.p12
spring.ssl.bundle.jks.service.keystore.password=secret
spring.ssl.bundle.jks.service.keystore.type=PKCS12
spring.ssl.bundle.pem.client.truststore.certificate=classpath:certificate.pem

logging.level.org.springframework=INFO
logging.level.org.eclipse.jetty=DEBUG
logging.level.org.eclipse.jetty.http3=DEBUG
logging.level.org.eclipse.jetty.quic=DEBUG

server.servlet.session.timeout=900
server.jetty.connection-idle-timeout=900000