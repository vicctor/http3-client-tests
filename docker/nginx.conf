user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Enhanced logging with HTTP/3 protocol information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'proto=$server_protocol';

    # HTTP/3 specific log format for detailed analysis
    log_format http3_detailed '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'proto=$server_protocol '
                              'connection_requests=$connection_requests '
                              'request_time=$request_time';

    access_log /var/log/nginx/access.log http3_detailed;

    # Basic settings optimized for HTTP/3
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 4096;
    client_max_body_size 16M;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # HTTP/3 and QUIC specific settings
    # These help Chrome properly negotiate HTTP/3
    
    # QUIC settings for optimal Chrome compatibility (basic settings only)
    quic_retry on;
    
    # SSL session settings optimized for HTTP/3
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_buffer_size 4k;

    # Enhanced gzip compression for HTTP/3
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli compression (if available) - better than gzip for HTTP/3
    # Note: This requires the brotli module to be compiled in
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Chrome HTTP/3 optimization settings
    # These headers help Chrome identify and use HTTP/3 properly
    map $server_protocol $http3_flag {
        default "";
        "~^HTTP/3" "h3";
    }
    
    map $server_protocol $connection_upgrade {
        default "";
        "~^HTTP/[12]" "h3";
    }

    # Add a variable to track if Alt-Svc should be sent
    map $server_protocol $alt_svc_header {
        default 'h3=":443"; ma=86400; persist=1, h3-29=":443"; ma=86400; persist=1, h3-28=":443"; ma=86400; persist=1';
        "~^HTTP/3" '';  # Don't send Alt-Svc if already on HTTP/3
    }

    # Rate limiting for HTTP/3 connections (helps with Chrome stability)
    limit_req_zone $binary_remote_addr zone=http3_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connection_limit:10m;

    # Security and performance headers that work well with HTTP/3
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # HTTP/3 specific headers for Chrome optimization
    add_header X-HTTP3-Available "true" always;
    add_header X-QUIC-Support "enabled" always;
    add_header Connection-Migration "supported" always;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}