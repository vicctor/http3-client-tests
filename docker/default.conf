server {
    listen 80;
    server_name localhost http3-test.local;
    
    # Redirect HTTP to HTTPS with Alt-Svc hint
    add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400' always;
    return 301 https://$server_name$request_uri;
}

server {
    # HTTPS and HTTP/3 QUIC - Enhanced for Chrome compatibility
    listen 443 ssl;
    listen 443 quic reuseport;
    
    # HTTP/2 directive (new syntax)
    http2 on;
    
    server_name localhost http3-test.local;
    root /var/www/html;
    index index.html;

    # SSL Certificate configuration
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    
    # Enhanced SSL Settings for HTTP/3 QUIC - Chrome optimized
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    
    # HTTP/3 and QUIC settings - Enhanced for Chrome
    ssl_early_data on;
    quic_retry on;
    
    # Critical: Enhanced Alt-Svc headers for Chrome HTTP/3 negotiation
    # This tells Chrome that HTTP/3 is available and should be preferred
    add_header Alt-Svc 'h3=":443"; ma=86400; persist=1, h3-29=":443"; ma=86400; persist=1, h3-28=":443"; ma=86400; persist=1, h3-27=":443"; ma=86400; persist=1' always;
    
    # HTTP/3 specific headers for Chrome detection and optimization
    add_header X-Protocol $server_protocol always;
    add_header X-HTTP3-Support "true" always;
    add_header X-QUIC-Status "enabled" always;
    add_header X-Alt-Svc-Advertised "h3 on port 443" always;
    
    # Chrome HTTP/3 optimization headers
    add_header Vary "Accept-Encoding, Alt-Used" always;
    add_header X-Chrome-HTTP3 "supported" always;
    add_header Connection-Migration "supported" always;
    
    # QUIC transport parameters for Chrome optimization
    add_header X-QUIC-Transport "max_idle_timeout=30s, max_udp_payload_size=1200, initial_max_data=10485760" always;

    # Security headers (unchanged)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Main location with enhanced HTTP/3 Early Hints for Chrome
    location / {
        # Enhanced Early Hints simulation with Link headers
        # Multiple resource types for comprehensive preloading
        add_header Link '</static/style.css>; rel=preload; as=style; crossorigin, </static/script.js>; rel=preload; as=script; crossorigin, </api/critical-data>; rel=preload; as=fetch; crossorigin, </static/fonts.woff2>; rel=preload; as=font; type=font/woff2; crossorigin' always;
        
        # Cache control optimized for HTTP/3
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        
        # HTTP/3 advertising headers (repeated for emphasis to Chrome)
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1, h3-29=":443"; ma=86400; persist=1' always;
        add_header X-Protocol $server_protocol always;
        add_header X-Early-Hints "Link headers + HTTP/3 QUIC optimization" always;
        add_header X-HTTP3-Benefit "0-RTT connections, no head-of-line blocking, connection migration" always;
        add_header X-Chrome-HTTP3-Negotiation "enabled" always;
        
        # Performance optimization headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-DNS-Prefetch-Control "on" always;
        
        try_files $uri $uri/ =404;
    }

    # Static resources with HTTP/3 optimization
    location /static/ {
        # Long-term caching for static resources over HTTP/3
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Preloaded "This resource was hinted for preloading via HTTP/3" always;
        add_header X-Static-Resource "optimized for HTTP/3" always;
        
        # Alt-Svc for static resources to ensure HTTP/3 usage
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1' always;
        
        # Compression and performance
        add_header Vary "Accept-Encoding, Alt-Used" always;
        
        try_files $uri $uri/ =404;
    }

    # API endpoint with HTTP/3 optimization
    location /api {
        add_header Content-Type "application/json" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Alt-Used" always;
        add_header X-Early-Hints-Benefit "This resource was hinted for preloading via HTTP/3" always;
        
        # HTTP/3 specific headers for API responses
        add_header X-API-HTTP3 "optimized" always;
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1' always;
        
        try_files $uri $uri/ /api.json;
    }

    # Enhanced critical data endpoint for HTTP/3 Early Hints demo
    location /api/critical-data {
        add_header Content-Type "application/json" always;
        add_header Cache-Control "max-age=300, stale-while-revalidate=600" always;
        add_header X-Critical-Resource "true" always;
        add_header X-Early-Hints-Preloaded "true" always;
        
        # Comprehensive HTTP/3 advertising for Chrome
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1, h3-29=":443"; ma=86400; persist=1' always;
        add_header X-HTTP3-Protocol $server_protocol always;
        add_header X-HTTP3-Benefits "0-RTT, No HOL blocking, Connection migration, Multiplexing" always;
        add_header X-Chrome-HTTP3-Compatible "true" always;
        add_header X-QUIC-Connection-ID "available" always;
        
        # Performance metrics headers
        add_header X-Response-Time "optimized-for-http3" always;
        add_header X-Server-Protocol "nginx-http3-quic" always;
        
        return 200 '{"message":"Critical data loaded via HTTP/3 Early Hints!","timestamp":"$time_iso8601","protocol":"$server_protocol","server":"nginx-http3-docker","connection_info":{"http3_support":true,"quic_enabled":true,"alt_svc_advertised":true,"chrome_compatible":true},"early_hints":{"status":"simulated via Link headers","implementation":"HTTP/3 QUIC + nginx","benefits":["Resource preloading","Faster page loads","0-RTT connections","No head-of-line blocking","Connection migration support","Multiplexing without HOL blocking"]},"http3_features":{"quic_versions":["h3","h3-29","h3-28","h3-27"],"alt_svc":"h3=\\\":443\\\"; ma=86400; persist=1","port":443,"ssl_early_data":"enabled","chrome_negotiation":"optimized","transport":"QUIC over UDP"},"performance":{"connection_migration":"supported","0_rtt":"enabled","multiplexing":"true","hol_blocking":"none","congestion_control":"cubic"}}';
    }

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type "text/plain" always;
        add_header X-Health-Check "HTTP/3 enabled" always;
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1' always;
        return 200 "healthy - HTTP/3 ready\n";
    }

    # Enhanced status endpoint with detailed HTTP/3 info
    location /status {
        add_header Content-Type "application/json" always;
        add_header X-Status-HTTP3 "enabled" always;
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1' always;
        return 200 '{"status":"ok","protocol":"$server_protocol","http3_enabled":true,"quic_support":true,"alt_svc":"h3=\\":443\\"; ma=86400; persist=1","time":"$time_iso8601","server":"nginx-http3","chrome_compatible":true}';
    }
    
    # Protocol detection endpoint for testing
    location /protocol-info {
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-cache" always;
        add_header Alt-Svc 'h3=":443"; ma=86400; persist=1' always;
        return 200 '{"current_protocol":"$server_protocol","http_version":"$http_version","connection":"$connection","request_time":"$request_time","chrome_http3_ready":true,"alt_svc_header":"h3=\\":443\\"; ma=86400; persist=1","negotiation_status":"ready"}';
    }

    # Logging with HTTP/3 specific format
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log main;
}